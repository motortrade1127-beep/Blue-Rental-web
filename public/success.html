<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deposit received | Blue Rental</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="success-page">
    <main class="success-panel">
      <a class="brand logo-mark" href="./index.html" aria-label="Blue Rental home">
        <img src="./assets/logo/blue-rental-logo-transparent-cropped.png" alt="Blue Rental">
      </a>
      <h1>Deposit payment submitted</h1>
      <p>Your booking request has been received. If online payment was completed, the deposit status, time and transaction reference have been recorded.</p>
      <p class="booking-ref">Booking reference: <span id="bookingRef">Loading</span></p>
      <p class="booking-ref">Payment provider: <span id="provider">Loading</span></p>
      <p class="booking-ref">Transaction reference: <span id="txn">Loading</span></p>
      <a class="button primary" href="./index.html">Back to home</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('bookingRef').textContent = params.get('booking') || 'Pending';
      document.getElementById('provider').textContent = params.get('provider') || (params.get('demo') ? 'Demo' : 'Pending');
      document.getElementById('txn').textContent = params.get('txn') || (params.get('demo') ? 'Demo payment' : 'Pending');
    </script>
  </body>
</html>
