<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment not completed | Blue Rental</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="success-page">
    <main class="success-panel">
      <a class="brand logo-mark" href="./index.html" aria-label="Blue Rental home">
        <img src="./assets/logo/blue-rental-logo-transparent-cropped.png" alt="Blue Rental">
      </a>
      <h1>Payment not completed</h1>
      <p>Your booking request has not been paid yet. You can try again or contact Blue Rental for help.</p>
      <p class="booking-ref">Booking reference: <span id="bookingRef">Pending</span></p>
      <p class="fine-print" id="reason"></p>
      <a class="button primary" href="./vehicles.html">Try again</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('bookingRef').textContent = params.get('booking') || 'Pending';
      document.getElementById('reason').textContent = params.get('reason') || '';
    </script>
    <script src="./chat-assistant.js" type="module"></script>
  </body>
</html>
